<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Raytracing</title>

		<link href="style.css" rel="stylesheet" type="text/css" media="all" />

		<script src="/dependencies/jquery-3.7.1.min.js"></script>
		<script src="html5kellycolorpicker.min.js"></script>
	</head>
	<body onload="setupControls()">
		<div id="rt-wrap">
			<div id="canvasHolder">
				<canvas id="myCanvas" width="600" height="600"></canvas>
				<script src="./Vec.js"></script>
				<script src="./Sphere.js"></script>
				<script src="./Cube.js"></script>
				<script src="./Plane.js"></script>
				<script src="./Camera.js"></script>
				<script src="./Ray.js"></script>
				<script src="./raytracing.js"></script>
				<script src="./controls.js"></script>
				<div id="loading">
					<p id="loading-text">Rendering</p>
					<div class="gooey">
						<span class="dot"></span>
						<div class="dots">
							<span></span>
							<span></span>
							<span></span>
						</div>
					</div>
				</div>
			</div>
			<div id="control-wrap">
				<button class="button" id="render-button">RENDER</button>
				<p id="obj-control-text">Object settings</p>
				<p id="gen-control-text">General settings</p>
				<div id="object-buttons">
					<p id="obj-text">Selected object</p>
					<button class="button obj-button" id="b0">Sphere 1</button>
					<button class="button obj-button" id="b1">Sphere 2</button>
					<button class="button obj-button" id="b2">Sphere 3</button>
					<button class="button obj-button" id="b3">Sphere 4</button>
					<button class="button obj-button" id="b4">Cube 1</button>
					<button class="button obj-button" id="b5">Cube 2</button>
					<button class="button obj-button" id="b6">Ground</button>
					<button class="button obj-button" id="b7">Skybox</button>
				</div>
				<button class="checkbox" id="light-button"></button>
				<button class="checkbox" id="ref-button"></button>
				<p id="light-button-label">Light source</p>
				<p id="ref-button-label">Reflective</p>
				<input type="range" min="-500" max="1100" value="300" class="slider" id="x-slider" />
				<p id="x-label">X</p>
				<input type="range" min="-500" max="1100" value="300" class="slider" id="y-slider" />
				<p id="y-label">Y</p>
				<input type="range" min="100" max="1700" value="500" class="slider" id="z-slider" />
				<p id="z-label">Z</p>
				<input type="range" min="10" max="500" value="100" class="slider" id="rad-slider" />
				<p class="slider-label" id="rad-label">Radius</p>
				<canvas id="color-canvas" width="140" height="140"></canvas><input id="color" value="#54aedb" />
				<div id="color-blocker"></div>

				<input type="range" min="100" max="800" value="450" class="slider" id="focal-slider" />
				<p class="slider-label" id="focal-label">Focal length</p>
				<input type="range" min="41" max="143" value="65" class="slider" id="fov-slider" />
				<p class="slider-label" id="fov-label">FOV:</p>
				<input type="range" min="0" max="1000000" value="400000" class="slider" id="light-slider" />
				<p class="slider-label" id="light-label">Light intensity</p>

				<input type="range" min="0" max="100" value="80" class="slider" id="shadow-slider" />
				<p class="slider-label" id="shadow-label">Max shadow</p>
				<input type="range" min="0" max="100" value="65" class="slider" id="highlight-slider" />
				<p class="slider-label" id="highlight-label">Max highlight</p>
				<input type="range" min="0" max="500" value="100" class="slider" id="floor-slider" />
				<p class="slider-label" id="floor-label">Shadow floor</p>

				<input type="range" min="0" max="200" value="100" class="slider" id="ref-slider" />
				<p class="slider-label" id="ref-label">Reflectivity</p>
				<input type="range" min="0" max="6" value="3" class="slider" id="bounce-slider" />
				<p class="slider-label" id="bounce-label">Max light bounces: 3</p>
				<input type="range" min="0" max="100" value="0" class="slider" id="gamma-slider" />
				<p class="slider-label" id="gamma-label">Gamma</p>

				<canvas id="preview-canvas" width="120" height="120"></canvas>
				<div id="camera-image"></div>

				<button class="button" id="preset1-button">Preset 1</button>
				<button class="button" id="preset2-button">Preset 2</button>
			</div>
		</div>
	</body>
</html>
